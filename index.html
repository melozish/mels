<style>

@media (prefers-reduced-motion:reduce){.toast{transition:none}}

const BASE = [{"id":"menemen","t":"Menemen","sub":"Менемен","c":"b","m":15,"d":1,"k":"tr","fish":false,"v":"tek tava","i":["3 yumurta","2 domates","1–2 sivri biber","1 yemek kaşığı tereyağı veya zeytinyağı","1 çay kaşığı pul biber","tuz","ekmek"],"s":["Biberleri halka halka doğrayıp yağda 2–3 dakika kavurun.","Rendelenmiş veya küçük doğranmış domatesi ekleyin, suyunu çekene kadar 5–7 dakika pişirin.","Yumurtaları kırıp hafifçe karıştırın, 1–2 dakika pişirin.","Yumurta hâlâ nemliyken ocaktan alın; sıcak tavada pişmeye devam eder."],"n":"Doğrudan tavadan, ekmek banarak yenir."},{"id":"omlet","t":"Kaşarlı otlu omlet","sub":"Омлет с сыром и зеленью","c":"b","m":10,"d":1,"k":"mix","fish":false,"v":"tek tava","i":["3 yumurta","2 yemek kaşığı süt","50 g kaşar peyniri","1 avuç maydanoz veya dereotu","1 çay kaşığı tereyağı","tuz, karabiber"],"s":["Yumurtaları süt, tuz ve karabiberle çırpın.","Tereyağını orta ateşte eritip yumurtaları dökün.","Bir dakika sonra kenarları ortaya doğru çekin.","Yarı pişince peynir ve otları serpip ikiye katlayın, kapağı kapatıp 1 dakika bekletin."],"n":"Ateşi yüksek tutmayın, omlet sertleşir."},{"id":"omletlor","t":"Lor peynirli otlu omlet","sub":"Омлет с творогом и зеленью","c":"b","m":10,"d":1,"k":"mix","fish":false,"v":"tek tava","i":["3 yumurta","3 yemek kaşığı lor peyniri","1 avuç dereotu ve maydanoz","1 çay kaşığı tereyağı","tuz, karabiber"],"s":["Yumurtaları tuz ve karabiberle çırpın, lor peyniri ve doğranmış otları ekleyin.","Tavada tereyağını eritip karışımı dökün.","Kısık-orta ateşte kapağı kapalı 4–5 dakika pişirin.","İkiye katlayıp servis yapın."],"n":"Lor yerine süzme peynir de olur."},{"id":"syrniki","t":"Sırniki (lor köftesi)","sub":"Сырники","c":"b","m":25,"d":2,"k":"ru","fish":false,"v":"tek tava","i":["300 g lor peyniri","1 yumurta","3 yemek kaşığı un, bulamak için biraz daha","1–2 yemek kaşığı şeker","1 tutam tuz","kızartmak için yağ","krema veya bal"],"s":["Lor peynirini çatalla ezin; sulu ise süzgeçte suyunu sıkın.","Yumurta, şeker, tuz ve unu ekleyip yoğun bir karışım yapın.","6 küçük köfte şeklinde yuvarlayıp unda çevirin.","Orta ateşte kapağı kapalı her yüzünü 3–4 dakika pişirin."],"n":"Karışım elinize yapışırsa bir kaşık un ekleyin."},{"id":"pankek","t":"Pancakes","sub":"Панкейки","c":"b","m":20,"d":1,"k":"mix","fish":false,"v":"tek tava","i":["1 su bardağı un","1 yemek kaşığı şeker","1 çay kaşığı kabartma tozu","1 tutam tuz","1 yumurta","¾ su bardağı süt","1 yemek kaşığı eritilmiş tereyağı","bal, meyve, yoğurt"],"s":["Kuru malzemeleri karıştırın.","Yumurta, süt ve tereyağını ekleyip topaksız ama çok çırpmadan karıştırın.","Hafif yağlı orta ateşteki tavaya kepçeyle dökün.","Yüzeyde kabarcıklar çıkınca çevirin, 1–2 dakika daha pişirin."],"n":"Hamuru fazla karıştırmayın, pankek kabarık kalır."},{"id":"blini","t":"Blini (ince krep)","sub":"Блины","c":"b","m":30,"d":2,"k":"ru","fish":false,"v":"tek tava","i":["2 yumurta","2 su bardağı süt","1,5 su bardağı un","1 yemek kaşığı şeker","1 tutam tuz","2 yemek kaşığı sıvı yağ","tereyağı, bal, krema veya lor"],"s":["Yumurta, şeker ve tuzu çırpıp sütün yarısını ekleyin.","Unu azar azar katıp topaksız hamur yapın, kalan sütü ve yağı ekleyin; 10 dakika dinlendirin.","Yağlanmış sıcak tavaya ince bir kat dökün, her yüzünü 1 dakika pişirin.","Tereyağı sürüp istediğiniz iç ile sarın."],"n":"İlk blini genelde bozuk çıkar, normaldir."},{"id":"ovsyanka","t":"Muzlu cevizli yulaf lapası","sub":"Овсянка с бананом и орехами","c":"b","m":10,"d":1,"k":"mix","fish":false,"v":"tencere","i":["60 g yulaf ezmesi","250 ml süt veya su","1 muz","1 avuç ceviz","1 çay kaşığı bal","tarçın"],"s":["Yulafı sütle orta ateşte karıştırarak 5 dakika pişirin.","Muzun yarısını ezip lapaya karıştırın.","Üzerine kalan muz, ceviz, bal ve tarçın ekleyin."],"n":"İki günlük yapıp ısıtarak yiyebilirsiniz."},{"id":"tost","t":"Kaşarlı domatesli tost","sub":"Тост с кашаром и помидором","c":"b","m":8,"d":1,"k":"tr","fish":false,"v":"tek tava","i":["4 dilim ekmek","100 g kaşar peyniri","1 domates","1 çay kaşığı tereyağı"],"s":["Ekmeğe kaşar ve domates dilimlerini koyup üstünü kapatın.","Dış yüzlerini tereyağıyla yağlayın.","Orta ateşte kapağı kapalı her yüzünü 2–3 dakika, peynir eriyene kadar pişirin."],"n":"Tost makinesinde de olur."},{"id":"avokadotost","t":"Avocado toast","sub":"Тост с авокадо","c":"b","m":10,"d":1,"k":"mix","fish":false,"v":"tek tava","i":["2 dilim ekmek","1 olgun avokado","1 yumurta (isteğe bağlı)","½ limon","1 tutam pul biber","tuz","zeytinyağı"],"s":["Ekmek dilimlerini kızartın.","Avokadoyu çatalla ezip limon suyu, tuz ve zeytinyağı ekleyin.","Ezmeyi ekmeklere sürün.","İsteyenler üstüne sahanda yumurta koyup pul biber serpsin."],"n":""},{"id":"yogurtbowl","t":"Yoghurt bowl","sub":"Йогурт-боул с овсянкой, мёдом, ягодами и орехами","c":"b","m":5,"d":1,"k":"mix","fish":false,"v":"ocaksız","i":["250 g yoğurt","3 yemek kaşığı yulaf ezmesi","1 yemek kaşığı bal","1 avuç meyve (çilek, yaban mersini, ahududu)","1 avuç ceviz veya badem","tarçın"],"s":["Yulafı 2 yemek kaşığı yoğurtla karıştırıp 5 dakika bekletin, yumuşasın.","Kalan yoğurdu kaseye alıp yulafı ekleyin.","Üzerine meyve ve kuruyemişleri dizin.","Bal gezdirip tarçın serpin."],"n":"Donmuş meyve de olur, kullanmadan 5 dakika önce çıkarın."},{"id":"serpme","t":"Serpme kahvaltı","sub":"Турецкий завтрак «россыпью»","c":"b","m":25,"d":1,"k":"tr","fish":false,"v":"tencere","i":["2–4 yumurta","2 domates","1 salatalık","1 avuç zeytin","100 g beyaz peynir","50 g kaşar peyniri","bal ve kaymak veya tereyağı","reçel","taze ekmek veya simit","çay"],"s":["Yumurtaları 8 dakika haşlayıp soğuk suya alın, soyun.","Domates ve salatalığı dilimleyip tabağa dizin.","Peynir, zeytin, bal, reçel ve tereyağını küçük kaselere paylaştırın.","İsterseniz yanına menemen veya sahanda yumurta ekleyin.","Çayı demleyip hepsini masaya serpin."],"n":"Pazar kahvaltısı için ideal; kalanlar buzdolabında saklanır."},{"id":"irmik","t":"Sütlü irmik lapası","sub":"Манная каша","c":"b","m":10,"d":1,"k":"ru","fish":false,"v":"tencere","i":["½ su bardağı irmik","2 su bardağı süt","1 yemek kaşığı şeker","1 çay kaşığı tereyağı","1 tutam tuz","reçel, bal veya meyve"],"s":["Sütü tuz ve şekerle kaynamaya getirin.","İrmiği ince bir akışla ekleyip sürekli karıştırın.","Kısık ateşte 3–4 dakika pişirin, topaklanmasın.","Tereyağını ekleyip reçel veya meyveyle servis yapın."],"n":"Kıvam koyu gelirse biraz süt ekleyin."},{"id":"ispanyol","t":"İspanyol patatesli omlet","sub":"Испанская тортилья с картошкой","c":"b","m":35,"d":2,"k":"it","fish":false,"v":"tek tava","i":["3 patates","1 soğan","5 yumurta","4 yemek kaşığı zeytinyağı","tuz","1 tutam karabiber"],"s":["Patatesleri ince dilimleyip soğanı doğrayın.","Yağda kısık ateşte patates ve soğanı kızartmadan 15 dakika yumuşatın.","Çırpılmış yumurta ve tuzu patateslerle karıştırıp 5 dakika bekletin.","Tavaya geri dökün, kapağı kapalı 5 dakika pişirin.","Tabakla çevirip diğer yüzünü 3 dakika pişirin."],"n":"Soğuk da çok güzeldir; bir gün önceden yapılabilir."},{"id":"mercimek","t":"Mercimek çorbası","sub":"Чечевичный суп","c":"s","m":25,"d":1,"k":"tr","fish":false,"v":"tencere","i":["150 g kırmızı mercimek","1 soğan","1 havuç","1 patates","1 yemek kaşığı domates salçası","1 yemek kaşığı tereyağı","1 litre su","1 çay kaşığı kimyon","limon, pul biber, tuz"],"s":["Soğanı yağda 3 dakika kavurup salçayı 1 dakika çevirin.","Yıkanmış mercimeği, doğranmış havuç ve patatesi ekleyin, suyu dökün.","Kaynayınca kısık ateşte 20 dakika pişirin.","Blenderdan geçirip kimyon ve tuz ekleyin.","Limon ve pul biberle servis yapın."],"n":""},{"id":"ezogelin","t":"Ezogelin çorbası","sub":"Эзогелин (чечевичный суп с булгуром и рисом)","c":"s","m":30,"d":1,"k":"tr","fish":false,"v":"tencere","i":["½ su bardağı kırmızı mercimek","2 yemek kaşığı pirinç","2 yemek kaşığı ince bulgur","1 soğan","1 yemek kaşığı domates salçası","1 yemek kaşığı tereyağı","1 litre su","1 çay kaşığı nane","1 çay kaşığı pul biber","tuz, limon"],"s":["Soğanı tereyağında 3 dakika kavurun, salçayı ekleyip 1 dakika çevirin.","Yıkanmış mercimek, pirinç ve bulguru ekleyip suyu dökün.","Kaynayınca kısık ateşte 20–25 dakika, mercimekler dağılana kadar pişirin.","Nane, pul biber ve tuzu ekleyin.","Limon sıkarak servis yapın."],"n":"Soğuyunca koyulaşır; ısıtırken su ekleyin."},{"id":"yayla","t":"Yayla çorbası (yoğurt çorbası)","sub":"Йогуртовый суп с рисом и мятой","c":"s","m":30,"d":2,"k":"tr","fish":false,"v":"tencere","i":["½ su bardağı pirinç","1 su bardağı yoğurt","1 yumurta sarısı","1 yemek kaşığı un","1 litre su","1 yemek kaşığı tereyağı","1 çay kaşığı kuru nane","tuz"],"s":["Pirinci 800 ml suda tuzla 15 dakika haşlayın.","Yoğurt, un ve yumurta sarısını çırpın; 1 kepçe sıcak çorba ekleyip karıştırın (ısıya alıştırma).","Karışımı yavaşça tencereye dökün, sürekli karıştırarak 5 dakika pişirin.","Tereyağında naneyi kızdırıp çorbaya gezdirin."],"n":"Karıştırmayı bırakmayın, yoksa yoğurt kesilir."},{"id":"kuzukulagi","t":"Kuzukulağı çorbası (Rus yeşil çorbası)","sub":"Щавелевый суп (зелёные щи)","c":"s","m":25,"d":1,"k":"ru","fish":false,"v":"tencere","i":["200 g kuzukulağı","2 patates","1 havuç","1 soğan","2 yumurta","1 litre su","1 yemek kaşığı yağ","dereotu","ekşi krema veya yoğurt","tuz"],"s":["Küp patatesleri kaynar suda 10 dakika pişirin; yumurtaları ayrı haşlayın (10 dakika).","Soğan ve havucu yağda 4 dakika kavurup çorbaya ekleyin.","İri doğranmış kuzukulağını ekleyip 3–4 dakika pişirin, fazla pişirmeyin.","Dereotu ve tuz ekleyin.","Yarım yumurta ve bir kaşık ekşi kremayla servis yapın."],"n":"Kuzukulağı ilkbaharda pazarda bulunur; bulamazsanız ıspanağa limon suyu ekleyerek ekşi tadı verin."},{"id":"mantarkrema","t":"Mantar kremalı çorba","sub":"Грибной крем-суп","c":"s","m":30,"d":1,"k":"mix","fish":false,"v":"tencere","i":["300 g mantar","1 soğan","2 diş sarımsak","1 yemek kaşığı tereyağı","1 yemek kaşığı un","500 ml su veya sebze suyu","100 ml krema veya süt","tuz, karabiber, kekik"],"s":["Soğan ve mantarı tereyağında suyu çekilene kadar 8 dakika kavurun, sarımsağı ekleyin.","Unu ekleyip 1 dakika çevirin, suyu ilave edin.","15 dakika pişirip blenderdan geçirin.","Kremayı ekleyip 2 dakika ısıtın, tuz ve kekikle tatlandırın."],"n":"Birkaç mantarı ayırıp dilimleyerek üzerine koyabilirsiniz."},{"id":"brokolikrema","t":"Brokoli kremalı çorba","sub":"Крем-суп из брокколи","c":"s","m":25,"d":1,"k":"mix","fish":false,"v":"tencere","i":["1 büyük brokoli (400 g)","1 patates","1 soğan","1 diş sarımsak","1 yemek kaşığı zeytinyağı","600 ml su","100 ml krema veya süt","tuz, karabiber, rendelenmiş kaşar"],"s":["Soğan ve sarımsağı zeytinyağında 3 dakika kavurun.","Küp patates, brokoli çiçekleri ve suyu ekleyip 15 dakika pişirin.","Blenderdan geçirip kremayı ekleyin.","Tuz ve karabiberle tatlandırıp üstüne kaşar serpin."],"n":"Rengi bozulmasın diye brokoliyi fazla pişirmeyin."},{"id":"shchi","t":"Taze lahana çorbası (şçi)","sub":"Щи из свежей капусты","c":"s","m":30,"d":1,"k":"ru","fish":false,"v":"tencere","i":["300 g beyaz lahana","2 patates","1 havuç","1 soğan","1 yemek kaşığı domates salçası","1 litre su","defne yaprağı","dereotu, ekşi krema","yağ, tuz, karabiber"],"s":["Küp patatesleri kaynar suda 10 dakika pişirin.","Soğan ve havucu salçayla 5 dakika kavurun.","İnce doğranmış lahanayı tencereye ekleyip 10 dakika pişirin.","Kavurmayı ve defne yaprağını ekleyip 5 dakika daha pişirin.","Ekşi krema ve dereotuyla servis yapın."],"n":"Ertesi gün daha lezzetlidir."},{"id":"borsch","t":"Etsiz pancar çorbası (borş)","sub":"Борщ без мяса","c":"s","m":40,"d":2,"k":"ru","fish":false,"v":"tencere","i":["1 pancar (yaklaşık 200 g)","2 patates","200 g lahana","1 havuç","1 soğan","2 yemek kaşığı domates salçası","1 yemek kaşığı limon suyu veya sirke","defne yaprağı","1 diş sarımsak","1,2 litre su","ekşi krema, dereotu"],"s":["Patatesleri kaynar suda 8 dakika pişirin.","Pancar ve havucu rendeleyip soğan, salça ve limon suyuyla 7 dakika kavurun; limon pancarın rengini korur.","Tencereye ince doğranmış lahanayı ekleyip 7 dakika pişirin.","Kavurmayı ve const mem = {};
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return mem[k]!==undefined?mem[k]:d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } }
function norm(s){ return String(s).toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ü/g,'u').replace(/[âàá]/g,'a').replace(/[îí]/g,'i').replace(/û/g,'u'); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = (s,r)=>(r||document).querySelector(s);

let custom = load('rcp.custom',[]);

const timeOf = r=>r.c==='w' ? '<span class="jp">葡</span>' : '<b>'+r.m+'</b> dk';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

function filtered(list){
  const q = norm(F.q.trim());
  return list.filter(r =>
    (F.cat==='all' || r.c===F.cat) &&
    (!F.fast || (r.c!=='w' && r.m<=20)) && (!F.fish || r.fish) &&
    (!F.k || r.k===F.k) &&
    (!q || norm(r.t+' '+(r.sub||'')+' '+r.i.join(' ')).includes(q)));
}

function rowHtml(r){
  return '<div class="row">'+
    '<a class="open" href="#/r/'+encodeURIComponent(r.id)+'"><span class="txt"><span class="ttl">'+esc(r.t)+dots(r.d)+'</span><span class="ru">'+esc(r.sub||r.v)+'</span></span>'+
    '<span class="lead"></span><span class="tm">'+timeOf(r)+'</span></a>'+heartBtn(r.id)+'</div>';
}

function paintFilters(){
  const cats=[['all','Hepsi','']].concat(Object.keys(CATS).map(k=>[k,CATS[k].n,CATS[k].k]));
  const cc=$('#catChips');
  if(cc) cc.innerHTML=cats.map(x=>'<button type="button" class="chip" data-a="cat" data-v="'+x[0]+'" aria-pressed="'+(F.cat===x[0])+'"><b>'+x[1]+'</b>'+(x[2]?'<span class="k jp">'+x[2]+'</span>':'')+'</button>').join('');
  const tg=[['fast','20 dk'],['fish','Deniz']];
  const tc=$('#togChips');
  if(tc) tc.innerHTML=tg.map(x=>'<button type="button" class="chip" data-a="tog" data-v="'+x[0]+'" aria-pressed="'+F[x[0]]+'"><b>'+x[1]+'</b></button>').join('')+
    KITCH.map(x=>'<button type="button" class="chip" data-a="kit" data-v="'+x[0]+'" aria-pressed="'+(F.k===x[0])+'"><b>'+x[1]+'</b></button>').join('');
}
function paintResults(){
  const el=$('#results'); if(!el) return;
  const list=filtered(allRecipes());
  const c=$('#count'); if(c) c.textContent=list.length+' / '+allRecipes().length;
  el.innerHTML=list.length?list.map(rowHtml).join(''):'<p class="empty">Bu filtrelerle tarif yok. Birini kaldırın.</p>';
}
function paintPick(anim){
  const el=$('#pickBox'); if(!el) return;
  if(pickId===null){el.innerHTML='';return;}
  if(pickId==='none'){el.innerHTML='<div class="pick"><p class="ru" style="margin:0">Bu filtrelere uyan tarif yok.</p></div>';return;}
  const r=byId(pickId); if(!r){el.innerHTML='';return;}
  el.innerHTML='<div class="pick'+(anim?' enter':'')+'"><h3>'+esc(r.t)+'</h3><p class="ru">'+CATS[r.c].n+' · '+(r.c==='w'?esc(r.p||''):r.m+' dk · '+esc(r.v))+'</p>'+
    '<div class="pa"><a class="lnk" href="#/r/'+encodeURIComponent(r.id)+'">Tarifi aç</a><button type="button" class="lnk" data-a="pick" data-s="'+(pickScope||'')+'">Başka bir tane</button></div></div>';
}
function doPick(scope){
  pickScope = scope || '';
  let pool;
  if(scope==='fav'){ pool=allRecipes().filter(r=>favs.has(r.id)); }
  else { pool=filtered(allRecipes()); if(F.cat==='all') pool=pool.filter(r=>!NOPICK[r.c]); }
  if(!pool.length){pickId='none';}
  else{let c;do{c=pool[Math.floor(Math.random()*pool.length)];}while(pool.length>1&&c.id===pickId);pickId=c.id;}
  paintPick(true);
}

  const on=favs.has(r.id), sec=SECS[r.c]||SECS.d;
  app.innerHTML='<a class="back" href="#/" data-a="back">← geri</a>'+
   '<div class="dhead"><span class="mark jp">'+CATS[r.c].k+'</span><h1>'+esc(r.t)+'</h1>'+(r.sub?'<p class="ru">'+esc(r.sub)+'</p>':'')+'</div>'+
   '<p class="meta"><span>'+CATS[r.c].n+'</span>'+(r.c==='w'?'':'<span class="t"><b>'+r.m+'</b>dk</span><span>'+esc(r.v)+'</span><span>zorluk '+dots(r.d)+'</span>')+'<span>'+esc(r.p||'2 kişilik')+'</span></p>'+
   '<div class="acts"><button type="button" class="lnk" data-a="addshop" data-id="'+esc(r.id)+'">Listeye ekle</button>'+
   '<button type="button" class="lnk fav-btn'+(on?' on':'')+'" data-a="fav" data-id="'+esc(r.id)+'" aria-pressed="'+on+'">'+HEART+(on?'Favoride':'Favoriye')+'</button>'+
   '<a class="lnk" href="#/edit/'+encodeURIComponent(r.id)+'">Düzenle</a></div>'+
   '<h2 class="sec">'+sec[0]+'<span class="k">一</span></h2><ul class="ing">'+r.i.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'+
   '<h2 class="sec">'+sec[1]+'<span class="k">二</span></h2><ol class="steps">'+r.s.map(x=>'<li><span>'+esc(x)+'</span></li>').join('')+'</ol>'+
   (r.n?'<p class="tip">'+esc(r.n)+'</p>':'')+
   (isCustom(r.id)?'<button type="button" class="lnk danger" data-a="del" data-id="'+esc(r.id)+'">Tarifimi sil</button>'
     : (edits[r.id]?'<button type="button" class="lnk danger" data-a="reset" data-id="'+esc(r.id)+'">Orijinal tarife dön</button>':''));
}
function viewShop(){
  if(!shop.length){app.innerHTML='<h1 class="ph">Alışveriş<span class="k jp">買</span></h1><p class="empty">Liste boş. Bir tarifi açıp «Listeye ekle» deyin.</p>';return;}
  const g={},order=[];
  shop.forEach((x,i)=>{if(!g[x.r]){g[x.r]=[];order.push(x.r);}g[x.r].push([x,i]);});
  const anyDone=shop.some(x=>x.done);
  app.innerHTML='<h1 class="ph">Alışveriş<span class="k jp">買</span></h1><div class="shop">'+
   order.map(n=>'<h3>'+esc(n)+'</h3><ul>'+g[n].map(p=>'<li><label><input type="checkbox" data-a="chk" data-i="'+p[1]+'"'+(p[0].done?' checked':'')+'><span class="'+(p[0].done?'done':'')+'">'+esc(p[0].t)+'</span></label></li>').join('')+'</ul>').join('')+
   '</div><div class="shop-actions">'+(anyDone?'<button type="button" class="lnk" data-a="clean">Alınanları kaldır</button>':'')+'<button type="button" class="lnk" data-a="clear">Listeyi temizle</button></div>';
}
function viewForm(id){
  const r = id ? byId(id) : null;
  if(id && !r){ app.innerHTML='<p class="empty">Tarif bulunamadı.</p><a class="lnk" href="#/">Menüye dön</a>'; return; }
  const v = r || {t:'',sub:'',c:'u',m:20,d:1,v:'tek tava',fish:false,i:[],s:[],n:'',p:''};
  const sel=(a,b)=>a===b?' selected':'';
  app.innerHTML=(r?'<a class="back" href="#/r/'+encodeURIComponent(r.id)+'" data-a="back">← geri</a>':'')+
   '<h1 class="ph">'+(r?'Tarifi düzenle':'Kendi tarifim')+'<span class="k jp">書</span></h1>'+
   '<p class="hint">'+(r?'Değişiklikler bu tarayıcıda saklanır.':'Tarif bu tarayıcıda saklanır ve menüde görünür.')+'</p>'+
   '<input type="hidden" id="f_id" value="'+esc(id||'')+'">'+
   '<label class="fld"><span>Tarif adı</span><input id="f_t" type="text" autocomplete="off" value="'+esc(v.t)+'"></label>'+
   '<label class="fld"><span>İkinci ad (isteğe bağlı)</span><input id="f_sub" type="text" autocomplete="off" value="'+esc(v.sub||'')+'"></label>'+
   '<div class="two"><label class="fld"><span>Tür</span><select id="f_c">'+Object.keys(CATS).map(k=>'<option value="'+k+'"'+sel(k,v.c)+'>'+CATS[k].n+'</option>').join('')+'</select></label>'+
   '<label class="fld"><span>Süre, dk</span><input id="f_m" type="number" min="1" max="240" value="'+(v.m||20)+'" inputmode="numeric"></label></div>'+
   '<div class="two"><label class="fld"><span>Zorluk</span><select id="f_d">'+[1,2,3].map(n=>'<option value="'+n+'"'+sel(n,v.d)+'>'+n+' · '+['kolay','orta','uzun'][n-1]+'</option>').join('')+'</select></label>'+
   '<label class="fld"><span>Kap</span><select id="f_v">'+VESSELS.map(x=>'<option'+sel(x,v.v)+'>'+x+'</option>').join('')+'</select></label></div>'+
   '<label class="fld"><span>Porsiyon</span><input id="f_p" type="text" autocomplete="off" placeholder="2 kişilik" value="'+esc(v.p||'')+'"></label>'+
   '<label class="fld chk"><input id="f_f" type="checkbox"'+(v.fish?' checked':'')+'><span>Balık veya deniz ürünü</span></label>'+
   '<label class="fld"><span>Malzemeler, her satıra bir tane</span><textarea id="f_i">'+esc(v.i.join('\n'))+'</textarea></label>'+
   '<label class="fld"><span>Adımlar, her satıra bir tane</span><textarea id="f_s">'+esc(v.s.join('\n'))+'</textarea></label>'+
   '<label class="fld"><span>Not (isteğe bağlı)</span><input id="f_n" type="text" autocomplete="off" value="'+esc(v.n||'')+'"></label>'+
   '<p class="err" id="err" hidden></p><button type="button" class="big" data-a="save">'+(r?'Değişiklikleri kaydet':'Tarifi kaydet')+'</button>';
}
function saveRecipe(){
  const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const id=$('#f_id').value, t=$('#f_t').value.trim(), i=lines('#f_i'), s=lines('#f_s'), err=$('#err');
  if(!t||!i.length||!s.length){err.hidden=false;err.textContent='Tarif adı, malzemeler ve en az bir adım gerekli.';return;}
  const f={t:t, sub:$('#f_sub').value.trim(), c:$('#f_c').value,
    m:Math.max(1,Math.min(240,parseInt($('#f_m').value,10)||20)), d:parseInt($('#f_d').value,10),
    fish:$('#f_f').checked, v:$('#f_v').value, p:$('#f_p').value.trim(), i:i, s:s, n:$('#f_n').value.trim()};
  let go;
  if(!id){
    const r=Object.assign({id:'c-'+Date.now().toString(36),k:'mix'},f);
    custom.push(r); save('rcp.custom',custom); go=r.id;
  } else if(isCustom(id)){
    const n=custom.findIndex(x=>x.id===id);
    if(n<0){err.hidden=false;err.textContent='Tarif bulunamadı.';return;}
    custom[n]=Object.assign({},custom[n],f); save('rcp.custom',custom); go=id;
  } else {
    edits[id]=f; save('rcp.edits',edits); go=id;
  }
  toast('Kaydedildi'); location.hash='#/r/'+encodeURIComponent(go);
}
function addShop(id){
  const r=byId(id); if(!r) return;
  let n=0;
  r.i.forEach(t=>{if(!shop.some(x=>x.r===r.t&&x.t===t)){shop.push({t:t,r:r.t,done:false});n++;}});
  save('rcp.shop',shop); paintTabs();
  toast(n?'Listeye eklendi: '+n:'Bu malzemeler zaten listede');
}
function toggleFav(id){
  if(favs.has(id)){favs.delete(id);toast('Favorilerden çıkarıldı');}else{favs.add(id);toast('Favorilere eklendi');}
  save('rcp.favs',Array.from(favs));
  const p=routeName();
  if(p==='r') viewDetail(decodeURIComponent(location.hash.split('/')[2]||''));
  else if(p==='fav') viewFav();
  else paintResults();
}
function routeName(){const p=location.hash.replace(/^#\/?/,'').split('/')[0];return p||'home';}
function paintTabs(){
  const p=routeName(), cur=(p==='r')?'home':(p==='edit'?'home':p);
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.t===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const n=shop.filter(x=>!x.done).length;
  $('#bdg').textContent=n?n:'';
}
function render(){
  const parts=location.hash.replace(/^#\/?/,'').split('/'), p=parts[0]||'home';
  document.body.dataset.home = (p==='home') ? '1' : '0';
  if(p==='r') viewDetail(decodeURIComponent(parts[1]||''));
  else if(p==='fav') viewFav();
  else if(p==='list') viewShop();
  else if(p==='add') viewForm(null);
  else if(p==='edit') viewForm(decodeURIComponent(parts[1]||''));
  else viewHome();
  paintTabs();
}
window.addEventListener('hashchange',()=>{navCount++;render();window.scrollTo(0,0);});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const a=t.dataset.a;
  if(a==='cat'){F.cat=t.dataset.v;pickId=null;paintFilters();paintResults();paintPick(false);}
  else if(a==='tog'){F[t.dataset.v]=!F[t.dataset.v];pickId=null;paintFilters();paintResults();paintPick(false);}
  else if(a==='kit'){F.k=(F.k===t.dataset.v)?'':t.dataset.v;pickId=null;paintFilters();paintResults();paintPick(false);}
  else if(a==='pick'){doPick(t.dataset.s);}
  else if(a==='fav'){toggleFav(t.dataset.id);}
  else if(a==='addshop'){addShop(t.dataset.id);}
  else if(a==='back'){e.preventDefault();if(navCount>0)history.back();else location.hash='#/';}
  else if(a==='chk'){const i=parseInt(t.dataset.i,10);if(shop[i]){shop[i].done=t.checked;save('rcp.shop',shop);viewShop();paintTabs();}}
  else if(a==='clean'){shop=shop.filter(x=>!x.done);save('rcp.shop',shop);viewShop();paintTabs();}
  else if(a==='clear'){shop=[];save('rcp.shop',shop);viewShop();paintTabs();}
  else if(a==='save'){saveRecipe();}
  else if(a==='reset'){
    const id=t.dataset.id; delete edits[id]; save('rcp.edits',edits);
    toast('Orijinal tarif geri geldi'); viewDetail(id);
  }
  else if(a==='del'){
    const id=t.dataset.id, nm=(byId(id)||{}).t;
    custom=custom.filter(r=>r.id!==id); favs.delete(id); shop=shop.filter(x=>x.r!==nm);
    save('rcp.custom',custom); save('rcp.favs',Array.from(favs)); save('rcp.shop',shop);
    toast('Tarif silindi'); location.hash='#/';
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;paintResults();}});
/* ---- mutfak müziği: tarayıcıda üretilen ambiyans ---- */
const MOODS = {
  sabah:{bpm:76, prog:[[53,57,60,64],[55,59,62,66],[48,52,55,59],[50,54,57,61]], lead:[0,2,4,7,9], oct:24, dens:.5, cut:2600, wave:'triangle'},
  aksam:{bpm:64, prog:[[45,48,52,55],[50,53,57,60],[43,47,50,54],[48,51,55,58]], lead:[0,3,5,7,10], oct:24, dens:.42, cut:1700, wave:'sine'},
  gece:{bpm:52, prog:[[41,48,51,55],[39,46,50,53],[44,51,54,58],[37,44,48,51]], lead:[0,3,5,8,10], oct:12, dens:.26, cut:1100, wave:'sine'}
};
let ac=null, bus=null, padGain=null, tickT=null, step=0, nextT=0, pad=[], crackle=null;
let mOn=false, mMood=load('rcp.mood','aksam'), mVol=load('rcp.vol',55);
const hz = n => 440*Math.pow(2,(n-69)/12);

function buildAudio(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  bus = ac.createGain(); bus.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
  const rev = ac.createConvolver();
  const len = Math.floor(ac.sampleRate*2.6), buf = ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const ch=buf.getChannelData(c);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  rev.buffer=buf;
  const wet=ac.createGain(); wet.gain.value=.5;
  bus.connect(lp); lp.connect(ac.destination); lp.connect(wet); wet.connect(rev); rev.connect(ac.destination);
  padGain = ac.createGain(); padGain.gain.value=.16; padGain.connect(bus);
  const nlen=Math.floor(ac.sampleRate*4), nb=ac.createBuffer(1,nlen,ac.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nlen;i++) nd[i]= Math.random()<.0007 ? (Math.random()*2-1)*.5 : (Math.random()*2-1)*.012;
  crackle=ac.createBufferSource(); crackle.buffer=nb; crackle.loop=true;
  const cg=ac.createGain(); cg.gain.value=.5; crackle.connect(cg); cg.connect(bus); crackle.start();
}
function note(f,t,dur,vol,wave){
  const o=ac.createOscillator(), g=ac.createGain(), fl=ac.createBiquadFilter();
  o.type=wave||'sine'; o.frequency.value=f;
  fl.type='lowpass'; fl.frequency.value=MOODS[mMood].cut;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl); fl.connect(g); g.connect(bus);
  o.start(t); o.stop(t+dur+.05);
}
function setPad(ch,t){
  pad.forEach(v=>{ v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0,t,1.1); v.o.stop(t+5); });
  pad=[];
  ch.forEach((n,i)=>{
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sawtooth'; o.frequency.value=hz(n); o.detune.value=(i%2?5:-5);
    const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=MOODS[mMood].cut*.55;
    g.gain.setValueAtTime(0,t); g.gain.setTargetAtTime(.055,t,1.3);
    o.connect(fl); fl.connect(g); g.connect(padGain); o.start(t);
    pad.push({o:o,g:g});
  });
}
function tick(){
  const M=MOODS[mMood], beat=60/M.bpm;
  while(nextT < ac.currentTime + .4){
    const bar=Math.floor(step/8)%M.prog.length, ch=M.prog[bar];
    if(step%8===0) setPad(ch,nextT);
    if(step%2===0){ note(hz(ch[0]-12),nextT,beat*1.9,.085,'sine'); }
    if(Math.random()<M.dens){
      const base=ch[Math.floor(Math.random()*ch.length)];
      const s=M.lead[Math.floor(Math.random()*M.lead.length)];
      note(hz(base+M.oct+(Math.random()<.3?s:0)),nextT,beat*(1.2+Math.random()),.07,M.wave);
    }
    nextT+=beat; step++;
  }
}
function musicOn(){
  if(!ac) buildAudio();
  if(ac.state==='suspended') ac.resume();
  mOn=true; step=0; nextT=ac.currentTime+.08;
  bus.gain.cancelScheduledValues(ac.currentTime);
  bus.gain.setTargetAtTime(mVol/100*.5,ac.currentTime,.7);
  clearInterval(tickT); tickT=setInterval(tick,120); tick();
  paintMusic();
}
function musicOff(){
  mOn=false; clearInterval(tickT); tickT=null;
  if(ac){ bus.gain.cancelScheduledValues(ac.currentTime); bus.gain.setTargetAtTime(0,ac.currentTime,.4); }
  paintMusic();
}
function paintMusic(){
  const b=$('#mBtn');
  b.setAttribute('aria-pressed',mOn);
  b.setAttribute('aria-label',mOn?'Müziği kapat':'Müziği aç');
  b.innerHTML = mOn ? '<span class="m-wave"><i></i><i></i><i></i></span>' : '<span class="jp">音</span>';
  $('#mPanel').hidden = !mOn;
  document.querySelectorAll('[data-a=mood]').forEach(o=>o.setAttribute('aria-pressed',o.dataset.v===mMood));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  if(t.dataset.a==='music'){ mOn?musicOff():musicOn(); }
  else if(t.dataset.a==='mood'){
    mMood=t.dataset.v; save('rcp.mood',mMood);
    if(mOn){ step=0; if(ac) nextT=ac.currentTime+.08; }
    paintMusic();
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='mVol'){
    mVol=parseInt(e.target.value,10); save('rcp.vol',mVol);
    if(mOn&&ac) bus.gain.setTargetAtTime(mVol/100*.5,ac.currentTime,.1);
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!ac) return;
  if(document.hidden && mOn) ac.suspend();
  else if(!document.hidden && mOn) ac.resume();
});
$('#mVol').value=mVol;
paintMusic();

render();
</script>
